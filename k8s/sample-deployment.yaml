apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: aisoc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aisoc-demo
  template:
    metadata:
      labels:
        app: aisoc-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
